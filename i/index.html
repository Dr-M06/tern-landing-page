<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tern ID</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#111;--mute:#777;--line:#e6e6e6;--sig:#ffb33a}
*{box-sizing:border-box;margin:0}
body{max-width:420px;margin:auto;padding:48px 24px 64px;background:#fff;color:var(--ink);
font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
-webkit-text-size-adjust:100%}
.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:600;letter-spacing:-.022em;
text-decoration:none;color:var(--ink)}
.brand svg{width:24px;height:24px;flex:none}
.brand .tm{font-size:.36em;font-weight:500;color:var(--mute);line-height:1;
margin-left:.08em;position:relative;top:-.42em}
h1{font-size:15px;font-weight:500;color:var(--mute);margin:56px 0 0}
.pin{font:600 36px/1.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
letter-spacing:.12em;margin:12px 0 0;color:var(--sig)}
.hint{color:var(--mute);font-size:14px;margin:18px 0 0;line-height:1.45}
.actions{display:flex;flex-direction:column;gap:10px;margin:36px 0 0}
a.btn,button.btn{display:block;text-align:center;border-radius:999px;padding:14px 18px;
font-size:15px;font-weight:600;text-decoration:none;border:1px solid var(--ink);
color:var(--ink);background:#fff;cursor:pointer;font:inherit}
a.btn.on,button.btn.on{background:var(--sig);border-color:var(--sig)}
a.btn:focus-visible,button.btn:focus-visible{outline:2px solid var(--sig);outline-offset:3px}
.err{margin-top:56px;color:var(--mute)}
footer{margin:48px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:13px}
footer a{color:var(--mute);text-decoration:none}
footer a:hover{color:var(--ink)}
</style>
</head>
<body>
<a class="brand" href="/">
<svg width="24" height="24" viewBox="0 0 96 96" aria-hidden="true"><path d="M65 31A24 24 0 0 1 43.8 71.6" fill="none" stroke="#ffb33a" stroke-width="11" stroke-linecap="round"/><path d="M33.2 66.9A24 24 0 0 1 26.3 37.9" fill="none" stroke="#ffb33a" stroke-width="11" stroke-linecap="round"/><path d="M31.9 30.2A24 24 0 0 1 60 27.2" fill="none" stroke="#ffb33a" stroke-width="11" stroke-linecap="round"/></svg>
tern<span class="tm" aria-hidden="true">&trade;</span>
</a>

<div id="ok" hidden>
<h1>Tern ID</h1>
<p class="pin" id="pin"></p>
<p class="hint">Encrypted messaging without a phone number. Open this link in Tern to start a chat.</p>
<div class="actions">
<a class="btn on" id="open" href="#">Open in Tern</a>
<button type="button" class="btn" id="copy">Copy Tern ID</button>
<a class="btn" href="/">Get Tern</a>
</div>
</div>

<p class="err" id="bad" hidden>This Tern ID link looks incomplete. Ask your friend to share again.</p>

<footer>
<a href="/privacy/">Privacy</a>
 · 
<a href="/terms/">Terms</a>
</footer>

<script>
(function () {
  var m = location.pathname.match(/\/i\/([0-9A-Fa-f]{8})\/?$/);
  var ok = document.getElementById('ok');
  var bad = document.getElementById('bad');
  if (!m) { bad.hidden = false; return; }
  var pin = m[1].toUpperCase();
  ok.hidden = false;
  document.getElementById('pin').textContent = pin;
  document.title = 'Tern ID ' + pin;
  var app = 'org.nomli.nlite://i/' + pin;
  var intent = 'intent://tern.niilox.com/i/' + pin +
    '#Intent;scheme=https;package=org.nomli.nlite;S.browser_fallback_url=' +
    encodeURIComponent(location.href) + ';end';
  var open = document.getElementById('open');
  open.href = /android/i.test(navigator.userAgent) ? intent : app;
  document.getElementById('copy').onclick = function () {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(pin);
    } else {
      var t = document.createElement('textarea');
      t.value = pin; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t);
    }
    this.textContent = 'Copied';
  };
})();
</script>
</body>
</html>
